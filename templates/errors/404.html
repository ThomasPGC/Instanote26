{% extends "base.html" %}
{% block title %}Page introuvable — Instanote{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-7 col-lg-6 text-center">
    <p class="display-1 fw-bold text-muted mb-0">404</p>
    <h1 class="h3 mb-3">Page introuvable</h1>
    <p class="text-muted">
      La page que vous cherchez n'existe pas ou a été déplacée.
    </p>
    {% if request.state.user %}
    <a href="/calcul" class="btn btn-primary">Aller au calcul</a>
    <a href="/" class="btn btn-outline-secondary ms-2">Accueil</a>
    {% else %}
    <a href="/" class="btn btn-primary">Retour à l'accueil</a>
    {% endif %}
  </div>
</div>
{% endblock %}
