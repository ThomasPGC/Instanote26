<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Instanote{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <style>
      /* CTA "Calcul portique" de la navbar : fond blanc + texte bleu au repos
         (même bleu que le bouton "Lancer un calcul" de l'accueil, btn-primary
         Bootstrap #0d6efd), fond bleu plein au survol. */
      .navbar-cta {
        color: #0d6efd;                 /* même bleu que btn-primary */
        border: 1px solid #0d6efd;      /* bordure fine de la même couleur */
        background-color: #fff;
        transition: background-color 0.2s, color 0.2s;
      }
      .navbar-cta:hover,
      .navbar-cta:focus-visible {
        background-color: #0d6efd;
        color: #fff;
      }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 position-relative">
    <a class="navbar-brand" href="/">Instanote — Calcul charpente</a>

    <a href="/calcul"
       class="btn navbar-cta fw-semibold px-3 position-absolute top-50 start-50 translate-middle">Calcul portique</a>

    <div class="d-flex align-items-center ms-auto">
    {% if request.state.user %}
    {% if request.state.user.is_superuser %}
    <a href="/admin" class="btn btn-warning btn-sm ms-2">Admin</a>
    {% endif %}
    <a href="/compte" class="btn btn-outline-light btn-sm ms-2">Mon compte — {{ request.state.user.email }}</a>
    <a href="/auth/logout" class="btn btn-outline-light btn-sm ms-2">Déconnexion</a>
    {% else %}
    <a href="/auth/login" class="btn btn-outline-light btn-sm ms-2">Connexion</a>
    <a href="/auth/register" class="btn btn-outline-light btn-sm ms-2">Inscription</a>
    {% endif %}
    </div>
</nav>
<div class="container mt-4 mb-5">
    {% block content %}{% endblock %}
</div>
</body>
</html>
